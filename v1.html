<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猜數字遊戲</title>
<style>
  :root {
    --bg: #f3f6f4;
    --panel: #ffffff;
    --ink: #1c2b25;
    --muted: #6b7c74;
    --line: #d5dfda;
    --accent: #1f7a5c;
    --high: #c2553a;
    --low: #2f6db3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a17;
      --panel: #1b2622;
      --ink: #e6efe9;
      --muted: #94a69d;
      --line: #2c3a35;
      --accent: #4cc39b;
      --high: #ee8a6f;
      --low: #7fb0ea;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px;
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }
  .status { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: .95rem; }
  .range {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: .04em;
    padding: 14px 0;
    margin-bottom: 16px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .row { display: flex; gap: 8px; }
  input[type=number] {
    flex: 1;
    min-width: 0;
    font-size: 1.2rem;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
  }
  button {
    font: inherit;
    padding: 10px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .msg { min-height: 1.6em; margin: 14px 0 6px; font-weight: 600; }
  .msg.high { color: var(--high); }
  .msg.low { color: var(--low); }
  .msg.win { color: var(--accent); }
  .history { list-style: none; margin: 0 0 16px; padding: 0; max-height: 150px; overflow-y: auto; font-size: .92rem; color: var(--muted); }
  .history li { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .controls { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>猜數字遊戲</h1>
  <p class="sub">電腦想了一個數字，看你幾次猜中。</p>

  <div class="status">
    <span>已猜 <strong id="count">0</strong> 次</span>
    <span>最佳紀錄：<strong id="best">—</strong></span>
  </div>

  <div class="range" id="range">1 ~ 100</div>

  <div class="row">
    <input type="number" id="guess" inputmode="numeric" placeholder="輸入數字" aria-label="輸入你猜的數字">
    <button id="submit">猜</button>
  </div>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <ul class="history" id="history"></ul>

  <div class="controls">
    <select id="level" aria-label="難度">
      <option value="50">簡單 1~50</option>
      <option value="100" selected>普通 1~100</option>
      <option value="1000">困難 1~1000</option>
    </select>
    <button class="ghost" id="restart">重新開始</button>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var max = 100, target, count, over, rangeMin = 1, rangeMax = 100;

  function loadBest() {
    try { return JSON.parse(localStorage.getItem("guess-best") || "{}"); } catch (e) { return {}; }
  }
  function saveBest(data) {
    try { localStorage.setItem("guess-best", JSON.stringify(data)); } catch (e) {}
  }
  function showBest() {
    var b = loadBest()[max];
    $("best").textContent = b ? b + " 次" : "—";
  }
  function setMsg(text, cls) {
    $("msg").textContent = text;
    $("msg").className = "msg " + (cls || "");
  }

  function start() {
    max = parseInt($("level").value, 10);
    rangeMin = 1;
    rangeMax = max;
    target = Math.floor(Math.random() * max) + 1;
    count = 0;
    over = false;
    $("count").textContent = 0;
    $("range").textContent = rangeMin + " ~ " + rangeMax;
    $("history").innerHTML = "";
    $("guess").value = "";
    $("guess").disabled = false;
    $("submit").disabled = false;
    $("guess").max = max;
    $("guess").min = 1;
    setMsg("");
    showBest();
    $("guess").focus();
  }

  function addHistory(n, text) {
    var li = document.createElement("li");
    li.textContent = "第 " + count + " 次：" + n + "　" + text;
    $("history").insertBefore(li, $("history").firstChild);
  }

  function guess() {
    if (over) return;
    var raw = $("guess").value.trim();
    var n = Number(raw);
    if (raw === "" || !Number.isInteger(n) || n < 1 || n > max) {
      setMsg("請輸入 1 到 " + max + " 之間的整數。", "high");
      return;
    }
    count++;
    $("count").textContent = count;

    if (n === target) {
      over = true;
      setMsg("答對了！答案是 " + target + "，你猜了 " + count + " 次。", "win");
      addHistory(n, "答對");
      $("guess").disabled = true;
      $("submit").disabled = true;
      var data = loadBest();
      if (!data[max] || count < data[max]) {
        data[max] = count;
        saveBest(data);
        showBest();
        setMsg("答對了！答案是 " + target + "，" + count + " 次，刷新最佳紀錄！", "win");
      }
    } else if (n > target) {
      setMsg("太大了，再小一點。", "high");
      addHistory(n, "太大");
      updateRange(n, true);
    } else {
      setMsg("太小了，再大一點。", "low");
      addHistory(n, "太小");
      updateRange(n, false);
    }
    $("guess").value = "";
    $("guess").focus();
  }

  function updateRange(n, tooHigh) {
    if (tooHigh) rangeMax = Math.min(rangeMax, n - 1);
    else rangeMin = Math.max(rangeMin, n + 1);
    $("range").textContent = rangeMin + " ~ " + rangeMax;
  }

  $("submit").addEventListener("click", guess);
  $("guess").addEventListener("keydown", function (e) { if (e.key === "Enter") guess(); });
  $("restart").addEventListener("click", start);
  $("level").addEventListener("change", start);

  start();
})();
</script>
</body>
</html>
