<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猜數字遊戲 版本選單</title>
<style>
  :root {
    --bg: #f3f6f4;
    --panel: #ffffff;
    --ink: #1c2b25;
    --muted: #6b7c74;
    --line: #d5dfda;
    --accent: #1f7a5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121a17;
      --panel: #1b2622;
      --ink: #e6efe9;
      --muted: #94a69d;
      --line: #2c3a35;
      --accent: #4cc39b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  main { max-width: 460px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  a.card {
    display: block;
    padding: 16px 18px;
    margin-bottom: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: inherit;
    text-decoration: none;
  }
  a.card:hover { border-color: var(--accent); }
  a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card strong { display: block; font-size: 1.1rem; margin-bottom: 2px; }
  .card span { color: var(--muted); font-size: .92rem; }
</style>
</head>
<body>
<main>
  <h1>猜數字遊戲</h1>
  <p class="sub">選一個版本開始玩。</p>

  <a class="card" href="v1.html">
    <strong>版本 1　基本版</strong>
    <span>三種難度、提示大小、最佳紀錄。</span>
  </a>

  <a class="card" href="v2.html">
    <strong>版本 2　答題紀錄版</strong>
    <span>保存每一局的紀錄，並統計成功率與平均次數。</span>
  </a>

  <a class="card" href="v3.html">
    <strong>版本 3　雲端紀錄版</strong>
    <span>輸入遊戲代號，遊戲過程記錄到 Google 試算表。</span>
  </a>

  <a class="card" href="https://script.google.com/macros/s/AKfycbyrqKwvNOYK5DfvriE6LtsLx7-ouCAsb8nBtP5RsdeLuXccUxy7Yf7DZLh8FKaLB-P2/exec">
    <strong>版本 4　Google 帳號個人存檔版</strong>
    <span>用 Google 帳號登入，進度存在你自己的試算表。首次使用需要 Google 授權。</span>
  </a>
</main>
</body>
</html>
